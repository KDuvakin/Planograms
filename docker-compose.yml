services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "sqlserver://db:1433;database=${DB_NAME:-PlanogramsDb};user=${DB_USER:-sa};password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true"
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-PlanogramsDb}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION}
      AZURE_TTS_MONTHLY_CHAR_LIMIT: ${AZURE_TTS_MONTHLY_CHAR_LIMIT:-500000}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - db
    expose:
      - "3000"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/opt/mssql
    expose:
      - "1433"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  dbdata:
  uploads:
  caddy_data:
  caddy_config:
